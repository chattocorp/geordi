name: Prepare and publish releases
on:
  push:
    branches: [main]
    paths:
      - '.sweet/**'
      - '.sweet.yml'
      - '.sweet.config.yml'
      - '.github/workflows/releases.yml'
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    permissions:
      contents: write
      pull-requests: write
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@11dc11d022585610ad9d751c3f0262f6ef754179
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}

  tag:
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: chattocorp/sweet-release/.github/workflows/tag.yml@11dc11d022585610ad9d751c3f0262f6ef754179
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}

  desktop:
    needs: tag
    if: needs.tag.outputs.tags != '[]'
    strategy:
      matrix:
        release: ${{ fromJSON(needs.tag.outputs.tags) }}
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ matrix.release.tag }}
      commit: ${{ matrix.release.commit }}
    secrets:
      MACOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
