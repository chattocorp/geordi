name: Prepare and publish releases
on:
  push:
    branches: [main]
    paths:
      - '.sweet/**'
      - '.sweet.yml'
      - '.sweet.config.yml'
      - '.github/workflows/releases.yml'
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    permissions:
      contents: write
      pull-requests: write
    # Unreleased Sweet Release commit (PRs #62 and #63, `sweet github release`): move to the next release tag.
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@3e714d17a99e4125dd758af128550cc6fedd1397
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}

  tag:
    if: github.event_name == 'push'
    permissions:
      contents: write
    # Unreleased Sweet Release commit (PRs #62 and #63, `sweet github release`): move to the next release tag.
    # Tags are pushed with GITHUB_TOKEN, so they start no tag workflow (no second beta build):
    # this run publishes them.
    uses: chattocorp/sweet-release/.github/workflows/tag.yml@3e714d17a99e4125dd758af128550cc6fedd1397

  desktop:
    needs: tag
    # `packages` maps the root package (`.`) to its new tag, or to null. It is empty when `tag`
    # is skipped (workflow_dispatch), hence the fallback.
    if: fromJSON(needs.tag.outputs.packages || '{}')['.'] != null
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ fromJSON(needs.tag.outputs.packages)['.'].tag }}
      commit: ${{ fromJSON(needs.tag.outputs.packages)['.'].commit }}
    secrets:
      MACOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
      MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
      MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
      MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}

  website:
    needs: [tag, desktop]
    # Stable releases only: betas are desktop downloads.
    if: fromJSON(needs.tag.outputs.packages || '{}')['.'] != null && !fromJSON(needs.tag.outputs.packages || '{}')['.'].prerelease
    permissions:
      contents: read
    uses: ./.github/workflows/website.yml
    with:
      tag: ${{ fromJSON(needs.tag.outputs.packages)['.'].tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  npm:
    needs: tag
    # Stable releases only: betas are desktop downloads.
    if: fromJSON(needs.tag.outputs.packages || '{}')['.'] != null && !fromJSON(needs.tag.outputs.packages || '{}')['.'].prerelease
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm.yml
    with:
      tag: ${{ fromJSON(needs.tag.outputs.packages)['.'].tag }}
      commit: ${{ fromJSON(needs.tag.outputs.packages)['.'].commit }}
