name: Desktop releases
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
    secrets:
      MACOS_SIGNING_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: true
      MACOS_NOTARY_API_KEY_BASE64:
        required: true
      MACOS_NOTARY_API_KEY_ID:
        required: true
      MACOS_NOTARY_API_ISSUER_ID:
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      - uses: ./.github/actions/package-desktop
      - name: Sign, notarize, and verify the macOS ZIP
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          MACOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        run: bash scripts/archive-macos.sh
      - name: Archive the Windows app
        if: runner.os == 'Windows'
        working-directory: apps/desktop/dist
        shell: bash
        run: |
          version=$(node -p "require('../package.json').version")
          7z a -tzip "Geordi-v${version}-Windows-x64.zip" Geordi-win32-x64
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ inputs.tag || github.sha }}-${{ matrix.target }}
          path: apps/desktop/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    if: inputs.tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      - uses: chattocorp/sweet-release/.github/actions/bootstrap@11dc11d022585610ad9d751c3f0262f6ef754179
        with:
          sweet-version: sweet@0.4.0
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-${{ inputs.tag }}-*
          merge-multiple: true
      - name: Publish both downloads
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$RELEASE_TAG
          notes="$RUNNER_TEMP/notes.md"
          sweet changelog --version "${tag#v}" -- . > "$notes"
          test -s "$notes"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --notes-file "$notes" --draft
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" --clobber \
            "Geordi-${tag}-macOS-arm64.zip" "Geordi-${tag}-Windows-x64.zip"
          gh release edit "$tag" --notes-file "$notes" --draft=false
