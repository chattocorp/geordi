name: Desktop releases
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      commit:
        type: string
        required: true
    secrets:
      MACOS_SIGNING_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: true
      MACOS_NOTARY_API_KEY_BASE64:
        required: true
      MACOS_NOTARY_API_KEY_ID:
        required: true
      MACOS_NOTARY_API_ISSUER_ID:
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
          - os: ubuntu-24.04
            target: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      - name: Set the prerelease version in the build checkout
        if: contains(inputs.tag, '-')
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]
          for app in apps/desktop apps/web; do
            (cd "$app" && npm pkg set version="${TAG#v}")
          done
      - uses: ./.github/actions/package-desktop
        env:
          GEORDI_RELEASE_BUILD: '1'
      - name: Sign, notarize, and verify the macOS ZIP and DMG
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          MACOS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_API_KEY_ID: ${{ secrets.MACOS_NOTARY_API_KEY_ID }}
          MACOS_NOTARY_API_ISSUER_ID: ${{ secrets.MACOS_NOTARY_API_ISSUER_ID }}
        run: bash scripts/archive-macos.sh
      - name: Archive the Windows app
        if: runner.os == 'Windows'
        working-directory: apps/desktop/dist
        shell: bash
        run: |
          version=$(node -p "require('../package.json').version")
          7z a -tzip "Geordi-v${version}-Windows-x64.zip" Geordi-win32-x64
      - name: Package the Linux app as a Debian package, tarball, and AppImage
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: node scripts/archive-linux.js
      - name: Verify the Linux AppImage
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          version=$(node -p "require('./package.json').version")
          image="$PWD/dist/Geordi-v${version}-Linux-x64.AppImage"
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test "$(ELECTRON_RUN_AS_NODE=1 squashfs-root/geordi -p 'process.arch')" = x64
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ inputs.tag || github.sha }}-${{ matrix.target }}
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.tar.gz
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/*-mac.yml
          if-no-files-found: error
          compression-level: 0

  publish:
    if: inputs.tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # `sweet github release` creates a draft when there is none: one run per tag at a time.
    concurrency:
      group: desktop-release-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
      # Sweet Release 0.5.0, pinned by commit. Keep every Sweet pin and `sweet-version` equal.
      - uses: chattocorp/sweet-release/.github/actions/bootstrap@70a402d3552871474f3a0f152fb2795592ec714a # sweet@0.5.0
        with:
          sweet-version: sweet@0.5.0
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-${{ inputs.tag }}-*
          merge-multiple: true
      - name: Publish desktop downloads
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$RELEASE_TAG
          version=$(node -p "require('./apps/desktop/package.json').version")
          channel=latest
          if [[ "$tag" =~ -(alpha|beta)\.[0-9]+$ ]]; then
            channel=${BASH_REMATCH[1]}
          else
            test "$tag" = "v$version"
          fi
          notes=()
          # A prerelease tag pushed by hand has no changelog section; it gets a placeholder.
          if ! sweet changelog --version "${tag#v}" -- . > /dev/null; then
            test "$channel" != latest
            printf '%s release %s.\n' "${channel^}" "$tag" > "$RUNNER_TEMP/notes.md"
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          fi
          sweet github release "$tag" --title "$tag" "${notes[@]}" \
            "Geordi-${tag}-macOS-arm64.dmg" "Geordi-${tag}-macOS-arm64.zip" "Geordi-${tag}-Windows-x64.zip" \
            "Geordi-${tag}-Linux-x64.AppImage" "Geordi-${tag}-Linux-x64.deb" "Geordi-${tag}-Linux-x64.tar.gz" \
            "Geordi-${tag}-macOS-arm64.zip.blockmap" "${channel}-mac.yml"
