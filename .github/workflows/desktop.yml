name: Desktop releases
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/actions/package-desktop/**'
      - '.github/workflows/desktop.yml'
      - 'apps/desktop/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  release-tag:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the release commit and desktop version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$GITHUB_REF_NAME" = "v$(jq -r .version apps/desktop/package.json)"

  package:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/package-desktop
      - name: Archive the desktop app
        working-directory: apps/desktop/dist
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(node -p "require('../package.json').version")
          archive="Geordi-v${version}-$TARGET.zip"
          if [[ "$RUNNER_OS" == macOS ]]; then
            ditto -c -k --keepParent Geordi-darwin-arm64/Geordi.app "$archive"
          else
            7z a -tzip "$archive" Geordi-win32-x64
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: apps/desktop/dist/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [release-tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --generate-notes --draft
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          gh release upload "$tag" --clobber \
            "Geordi-$GITHUB_REF_NAME-macOS-arm64.zip" "Geordi-$GITHUB_REF_NAME-Windows-x64.zip"
          gh release edit "$tag" --draft=false
