name: Website
on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      # The website is drawn with the forge's design system.
      - apps/web/src/routes/layout.css
      - pnpm-lock.yaml
      - .github/workflows/website.yml
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://geordi.run
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/install
      - name: Read the version served by the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "GEORDI_DOWNLOAD_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - run: pnpm --filter @geordi/website run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
