name: Website
on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      # The website is drawn with the forge's design system.
      - apps/web/src/routes/layout.css
      - pnpm-lock.yaml
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://geordi.run
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm --filter @geordi/website run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
