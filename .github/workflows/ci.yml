name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm check
      - run: pnpm lint
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @geordi/web exec playwright install --with-deps --only-shell chromium
      - name: Configure Git for test repositories
        run: |
          git config --global user.name 'Geordi CI'
          git config --global user.email 'ci@example.invalid'
      - run: pnpm test
