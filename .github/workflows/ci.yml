name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install
      - run: pnpm check
      - run: pnpm lint
      # The browser depends on Playwright's version only, not on the whole lockfile.
      - id: playwright
        run: echo "version=$(pnpm --filter @geordi/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # The hosted runner already has the shared libraries for headless Chromium.
      - run: pnpm --filter @geordi/web exec playwright install --only-shell chromium
      - name: Configure Git for test repositories
        run: |
          git config --global user.name 'Geordi CI'
          git config --global user.email 'ci@example.invalid'
      - run: pnpm test

  windows-session-recovery:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install
      - name: Keep session directories private
        run: pnpm --filter @geordi/daemon test src/session-process.spec.ts src/daemon-owner.spec.ts --testTimeout 30000
      - name: Recover detached Windows sessions
        run: pnpm --filter @geordi/daemon test src/session.spec.ts -t "a daemon restart|a launched daemon|when killed" --testTimeout 30000
