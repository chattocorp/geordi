name: Package Geordi
description: Build the desktop app and its native dependencies on the target platform.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '26'
    - uses: pnpm/action-setup@v6
      with:
        version: 12.18.0
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm desktop:package
      shell: bash
