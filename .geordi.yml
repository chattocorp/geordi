setup: pnpm install --frozen-lockfile

tasks:
  web:
    label: Services / Web server
    command: node scripts/workspace-dev.mjs web
    # the forge's pages, its WebSocket for daemons, and the one for browsers
    ports: [web, daemon, live]
  daemon:
    label: Services / Agent daemon
    command: node scripts/workspace-dev.mjs daemon
    needs: [web]
  app:
    label: Geordi
    url: http://localhost:{web}/
    needs: [daemon]
    default: true
  reset:
    label: Services / Reset development data
    command: node scripts/workspace-dev.mjs reset
  storybook:
    label: Storybook
    command: node scripts/workspace-dev.mjs storybook
    ports: [storybook]
    url: http://localhost:{storybook}/

  website:
    label: Website
    command: pnpm --filter @geordi/website dev --port $PORT
    ports: [website]
    url: http://localhost:{website}/

  desktop:
    label: Desktop / Electron dev app
    command: pnpm desktop:dev
    ports: [desktop, desktop-daemon, desktop-live]

  install:
    label: Desktop / Install Geordi.app
    command: pnpm desktop:install

sections:
  - path: apps/web
    title: Forge
  - path: apps/daemon
    title: Daemon
  - path: apps/desktop
    title: Desktop app
  - path: apps/cli
    title: CLI
  - path: apps/website
    title: Website
  - path: packages/ui
    title: UI components
  - path: packages/protocol
    title: Protocol
  - path: packages/launch
    title: Launch
  - path: docs
    title: Decision records
  - path: planning
    title: Backlog
  - path: .sweet
    title: Release notes
