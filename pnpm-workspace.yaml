packages:
  - apps/*
  - packages/*

engineStrict: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  electron: true
  electron-winstaller: false
  # Wrangler only deploys the website; its local runtime is never started.
  workerd: false

catalog:
  '@pierre/diffs': ^1.6.4
  '@types/node': ^24.19.2
  playwright: ^1.65.1
  typescript: ^6.0.3
  vitest: ^4.1.12
  '@vitest/browser-playwright': ^4.1.12
patchedDependencies:
  '@agentclientprotocol/codex-acp@2.8.0': patches/@agentclientprotocol__codex-acp@2.8.0.patch
  forges@0.3.2: patches/forges@0.3.2.patch
# The agents' own programs (some 300 MB each): Geordi runs the ones people have installed.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-*'
