packages:
  - apps/*
  - packages/*

engineStrict: true
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: false
  # Wrangler only deploys the website; its local runtime is never started.
  workerd: false

catalog:
  '@types/node': ^24
  typescript: ^6.0.3
  vitest: ^4.1.8
  '@vitest/browser-playwright': ^4.1.8
patchedDependencies:
  '@agentclientprotocol/codex-acp@2.7.0': patches/@agentclientprotocol__codex-acp@2.7.0.patch
  forges@0.3.2: patches/forges@0.3.2.patch
# The agents' own programs (some 300 MB each): Geordi runs the ones people have installed.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-*'
  - '@openai/codex-*'
