<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the theme before first paint: saved choice, else the system preference.
			try {
				const saved = localStorage.getItem('theme');
				const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			} catch {}
			// The desktop app (ADR-008) has no title bar: the layout makes up for it. On macOS the
			// window's buttons are on the left; elsewhere they are drawn over the top right, and
			// take the page's colours.
			if (navigator.userAgent.includes('Electron')) {
				const root = document.documentElement;
				root.dataset.desktop = navigator.userAgent.includes('Macintosh') ? 'mac' : '';
				const paint = () => {
					const style = getComputedStyle(root);
					window.geordiDesktop?.titleBar?.({
						color: style.getPropertyValue('--frame').trim(),
						symbolColor: style.getPropertyValue('--muted').trim()
					});
				};
				if (!root.dataset.desktop) {
					new MutationObserver(paint).observe(root, { attributeFilter: ['class'] });
					addEventListener('load', paint);
				}
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
