<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply the theme before first paint: saved choice, else the system preference.
			try {
				const saved = localStorage.getItem('theme');
				const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
			} catch {}
			// The desktop app (ADR-008) has no title bar: the layout makes up for it.
			if (navigator.userAgent.includes('Electron')) document.documentElement.dataset.desktop = '';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
