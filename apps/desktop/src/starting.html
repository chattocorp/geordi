<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'unsafe-inline'"
		/>
		<title>Geordi</title>
		<!--
			What the window shows until the forge answers (main.js): Geordi's mark on the frame's
			colour, fading in, its slats lighting up gold one after the other while it starts. The colours are the
			web app's tokens (layout.css), which this page cannot load.
		-->
		<style>
			:root {
				color-scheme: light dark;
				--frame: #e3e3eb;
				--muted: #585a69;
				--accent: #f5b021;
				--silver: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--frame: #17191f;
					--muted: #a0a3b4;
					--accent: #f7b733;
					--silver: #e8eaf2;
				}
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: grid;
				place-items: center;
				background: var(--frame);
				-webkit-app-region: drag;
				user-select: none;
			}
			svg {
				width: 112px;
				height: 56px;
				/* barely there: almost the frame's colour, so the gold stands out */
				color: color-mix(in srgb, var(--muted), var(--frame) 82%);
				overflow: visible;
				animation: appear 1.2s cubic-bezier(0.4, 0, 0.2, 1) both;
			}
			.slat {
				transform-box: fill-box;
				transform-origin: center;
				animation: flash 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.4s infinite both;
			}
			.slat:nth-child(2) {
				animation-delay: 0.52s;
			}
			.slat:nth-child(3) {
				animation-delay: 0.64s;
			}
			@keyframes appear {
				from {
					opacity: 0;
				}
			}
			/* each slat lights up gold, quickly, and fades back */
			@keyframes flash {
				0%,
				50%,
				100% {
					stroke: currentColor;
					transform: scaleY(1);
					filter: drop-shadow(0 0 0 transparent);
				}
				12% {
					stroke: var(--accent);
					transform: scaleY(1.35);
					/* in the mark's units: about 6px on screen */
					filter: drop-shadow(0 0 2px var(--accent));
				}
			}
			.shimmer {
				opacity: 0.6;
				filter: drop-shadow(0 0 1px var(--silver));
			}
			@media (prefers-reduced-motion: reduce) {
				.shimmer {
					display: none;
				}
				svg,
				.slat {
					animation: none;
				}
			}
		</style>
	</head>
	<body>
		<!-- the mark as `Logo.svelte` draws it -->
		<svg viewBox="0 0 28 14" fill="none" role="img" aria-label="Starting Geordi">
			<rect x="1" y="1" width="26" height="12" rx="6" stroke="currentColor" stroke-width="1.75" />
			<!-- a slanted band of silver light sweeps once across the outline, left to right -->
			<defs>
				<linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-12" y1="0" x2="-4" y2="4">
					<stop offset="0" stop-color="var(--silver)" stop-opacity="0" />
					<stop offset="0.5" stop-color="var(--silver)" />
					<stop offset="1" stop-color="var(--silver)" stop-opacity="0" />
					<animateTransform
						attributeName="gradientTransform"
						type="translate"
						from="8 0"
						to="44 0"
						begin="0s"
						dur="1.2s"
						calcMode="spline"
						keyTimes="0;1"
						keySplines="0.2 0 0.2 1"
						fill="freeze"
					/>
				</linearGradient>
			</defs>
			<rect
				class="shimmer"
				x="1"
				y="1"
				width="26"
				height="12"
				rx="6"
				stroke="url(#sheen)"
				stroke-width="1.75"
			/>
			<g stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
				<path class="slat" d="M8.5 5v4" />
				<path class="slat" d="M14 5v4" />
				<path class="slat" d="M19.5 5v4" />
			</g>
		</svg>
	</body>
</html>
